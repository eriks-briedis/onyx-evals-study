    question_id: VRQ-016
    scenario_date: undated
    role: law unchanged across versions
    gold_answer: "No, they're not the same thing. Agreeing to a bond deduction means agreeing to a claim on the bond: the landlord or agent gives you bond claim evidence, and a claim to the Bond Authority that pays money to the landlord is made jointly or on a form you sign that states the amount (s 411). Your bond came back in full, so either no claim for the cleaning was made or the Authority repaid it without a dispute (s 411AC). That doesn't wipe the slate: the Act says recovering from a bond doesn't stop a landlord claiming more as compensation, and the same logic applies when nothing was taken (s 214). But an invoice is not a debt you must pay just because it arrives. If you don't agree, the landlord's route is to claim compensation through VCAT, where they must show you didn't leave the place reasonably clean, judged against its condition at the start of the tenancy (s 63; the cleaning claim in s 411AB(c)). What to do: reply in writing that you don't accept the invoice, say what you understood the bond arrangement to be, keep your exit photos and the condition report, and let them take it to VCAT if they want to pursue it."
    optional_credit:
      - "Full repayment of the bond does not by itself bar the landlord from seeking compensation (s 214), but the invoice is not enforceable on its own: a disputed claim has to go to VCAT."
