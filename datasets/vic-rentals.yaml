    scenario_date: 2026-10-15
    role: partly outside the law documents
    gold_answer: No. A renter who becomes aware of damage must tell the landlord in writing, as soon as practicable, that it happened and what it is (email is allowed). Renters must not intentionally or carelessly damage the home, and at the end of the lease must leave it in the same condition as when they moved in, allowing for fair wear and tear; pet damage isn't fair wear and tear. Without written consent, renters also can't make alterations beyond the small list of allowed ones, so it's safest to agree on the repair before doing it. Because they're moving out, the home's condition will be compared with when they moved in, so the damage needs to be dealt with either way. Rental law doesn't say whether this affects the owner's insurance; that depends on the policy, which isn't in these documents. A lease can't make the renter pay the owner's insurance excess by default. The renters should tell the landlord or agent in writing about the damage, offer to fix it or pay for it, and agree in writing on how and by whom the repair will be done. For insurance, the owner would need to check their policy or ask their insurer.
