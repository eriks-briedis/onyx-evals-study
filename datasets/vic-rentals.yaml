    gold_answer: A landlord must give at least 60 days notice of a rent increase, using the official form (Form 5). The notice must state the amount, how it was worked out, and the renter's right to ask the Director of Consumer Affairs Victoria to investigate within 30 days. Rent can't go up more than once in 12 months. A rent increase that doesn't follow these rules is invalid. An ordinary email without Form 5 is not a valid notice, so the renter doesn't have to pay the higher rent yet. Notices can be sent by email, but only under the Electronic Transactions (Victoria) Act 2000, which the standard lease links to the renter agreeing to email notices (item 9). If a proper Form 5 notice arrives later, the increase can start no sooner than 60 days after it is given. Until then the renter keeps paying the current rent. They can tell the agent in writing that no official notice has arrived, and if a proper notice comes and the increase seems too high, ask Consumer Affairs Victoria to investigate within 30 days.
