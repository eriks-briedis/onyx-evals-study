    gold_answer: "Three things. First, the landlord's details: when there is no agent, the landlord must give you written notice of their full name and address for service of documents, plus an emergency phone number for urgent repairs, and must tell you in writing of any change in those details within 7 days of the change (s 66). Ask for that notice before you change where you pay, and check the name matches the landlord on your lease. Second, your bond: the landlord or agent must lodge it with the Residential Tenancies Bond Authority within 10 business days of receiving it, and you should have a receipt or notice from the Authority showing it is held there, not by the agent or landlord (ss 406–407). If you don't have one, ask for it. Third, how rent is paid: rent is payable in the way your agreement says, and the way it is paid can be changed by agreement between you and the landlord; the landlord must still make a fee-free payment method reasonably available (s 42). Confirm the new account details with the agency through a number or address you already know, not just by replying to the message, and keep the written confirmation. Until you've done that, keep paying as the lease says."
