    question_id: NEWSQ-003
    scenario_date: 2025-12-03
    role: partly outside the law documents
    gold_answer: "You don't have to be home yourself. Your duty is to let the landlord or agent in when they enter properly, not to attend. Checking the smoke alarms is the landlord's own duty (s 68AA, in force since 25 November 2025, and the smoke-alarm term in the standard agreement), and entry to carry out a duty under the Act is allowed between 8 am and 6 pm on any day except a public holiday with at least 24 hours' written notice that says why they're coming. Seven days' notice in writing meets that, so the agent, who has a key, can bring the inspector in at the notified time whether or not you are there. Nothing in the Act lets the agent charge you a $90 rebooking fee; the testing is the landlord's cost. If you actually refused a lawful entry, the landlord's route would be a breach-of-duty claim and compensation through VCAT, not a fee of their choosing. What you can do: reply in writing that you don't object to entry at the notified time and they may use their key, and that you don't accept the $90 charge. If the window is a real problem, you can propose another time, or apply to VCAT for an order limiting entry days and times."
    optional_credit:
      - Nothing in the Act provides for a $90 re-inspection fee; the landlord's only route to any cost is a breach-of-duty or compensation claim through the Tribunal if entry was refused.
