defaultTest:
  options:
    provider:
      id: 'openai:chat:{{env.JUDGE_MODEL}}'
      config:
        apiBaseUrl: '{{env.JUDGE_BASE_URL}}'
        apiKey: unused
        temperature: 0
        max_tokens: 4096
  assert:
    - type: javascript
      value: file://dist/src/asserts/noError.js
      metric: no_error
    # No search ran: the passages were given. Recorded as a pass so gold pass keeps its four parts.
    - type: javascript
      value: "({ pass: true, score: 1, reason: 'the gold passages were given in the message; retrieval holds by construction' })"
      metric: retrieval

tests: file://datasets/vic-rentals-oracle.yaml
