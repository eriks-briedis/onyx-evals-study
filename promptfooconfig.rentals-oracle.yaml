      body:
        message: "{{passages}}\n\nQuestion: {{question}}"
        chat_session_info:
          persona_id: 0
        internal_search_filters:
          document_set:
            - vic-rentals-baseline
        llm_override:
          model_configuration_id: 0      # written by the hook -> gpt-5.6-luna via the openai provider (API key), manifest luna-api
          temperature: 0
        stream: false
        include_citations: true
      transformResponse: (json) => json

  - id: https
    label: 'rentals-oracle:sol-api'
    config:
      url: '{{env.ONYX_BASE_URL}}/api/chat/send-chat-message'
      method: POST
      headers:
        Content-Type: application/json
