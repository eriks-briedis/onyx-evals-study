  - id: https
    label: 'rentals-oracle:qwen'
    config:
      url: '{{env.ONYX_BASE_URL}}/api/chat/send-chat-message'
      method: POST
      headers:
        Content-Type: application/json
      maxRetries: 0
      body:
        message: "{{passages}}\n\nQuestion: {{question}}"
        chat_session_info:
          persona_id: 0
        internal_search_filters:
          document_set:
            - vic-rentals-baseline
        llm_override:
          model_configuration_id: 0      # written by the hook -> qwen3.6:35b (local Ollama)
          temperature: 0
        stream: false
