# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: Onyx retrieval and answer quality - Victorian rentals

extensions:
  - file://dist/src/setup.js:hook

prompts:
  - '{{question}}'

providers:
  # One entry per cell of the matrix. `label` carries both axes as
  # `<promptVariant>:<modelLabel>`: the beforeAll hook looks up manifest.personas[].variant
  # by the first half and manifest.models[].label by the second, then writes the resolved
  # persona id and model_configuration_id into config.body. Auth headers are injected there
  # too — promptfoo issues these requests itself and has no session of its own.
  #
  # Both ids below are deliberately invalid so an unbound provider fails loudly rather than
  # running persona 0 (the default Assistant) on whatever model Onyx defaults to.
  # model_configuration_id is mandatory: with only a model_version, factory.py:180 falls
  # through to get_default_llm() and still returns 200, so the run would claim a model it
  # never used. The manifest owns the real ids.
  #
  # The entries are written out in full rather than sharing a YAML anchor. An anchor
  # makes both providers point at ONE body object, so binding the second would silently
  # rewrite the first and both cells would run the same model under different labels.
  # bindProviders now refuses that outright, but the duplication is the first line of
  # defence. Keep the entries in step by hand.
  - id: https
    label: 'rentals:haiku'
    config:
      url: '{{env.ONYX_BASE_URL}}/api/chat/send-chat-message'
      method: POST
      headers:
        Content-Type: application/json
      # Default is 4. A retry hides a failure and doubles the cost.
      maxRetries: 0
      body:
        message: '{{question}}'
        chat_session_info:
          persona_id: 0
        internal_search_filters:
          document_set:
            - vic-rentals-baseline
        llm_override:
          model_configuration_id: 0      # written by the hook -> configuration 129, claude-haiku-5-5
          temperature: 0
        stream: false
        include_citations: true
      transformResponse: (json) => json

  - id: https
    label: 'rentals:luna'
