defaultTest:
  options:
    # One judge for every model: JUDGE_MODEL=claude-opus-5-5. It grades haiku too, which the
    # beforeAll hook allows only for judges in SAME_FAMILY_CLEARED (src/setup.ts), on the
    # hand-check evidence. JUDGE_BASE_URL is any OpenAI-compatible endpoint serving the judge model.
    provider:
      id: 'openai:chat:{{env.JUDGE_MODEL}}'
      config:
        apiBaseUrl: '{{env.JUDGE_BASE_URL}}'
        apiKey: unused
        temperature: 0
        # The judge endpoint's default output cap was 1024 tokens. A judge reasoning over a long answer
        # runs past it, the JSON verdict is cut off, and llm-rubric records a grader error.
        max_tokens: 4096
  assert:
    - type: javascript
      value: file://dist/src/asserts/noError.js
      metric: no_error
    # Primary metrics.
    - type: javascript
      value: file://dist/src/asserts/toolInvocation.js
      metric: tool_invocation
    - type: javascript
      value: file://dist/src/asserts/retrieval.js
      metric: retrieval
    - type: javascript
      value: file://dist/src/asserts/citationSupport.js
      metric: citation_support

# Compiled by `npm run cases -- cases/vic-rentals.yaml`. Run with `npm run eval:rentals`, which
# sets EVAL_CORPUS=vic-rentals-baseline; bindProviders refuses to bind these providers to any
# other document set.
tests: file://datasets/vic-rentals.yaml
