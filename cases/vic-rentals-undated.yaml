      written consent, renters also can't make alterations beyond the small list of allowed ones, so it's
      safest to agree on the repair before doing it. Because they're moving out, the home's condition
      will be compared with when they moved in, so the damage needs to be dealt with either way. Rental
      law doesn't say whether this affects the owner's insurance; that depends on the policy, which isn't
      in these documents. A lease can't make the renter pay the owner's insurance excess by default. The
      renters should tell the landlord or agent in writing about the damage, offer to fix it or pay for
