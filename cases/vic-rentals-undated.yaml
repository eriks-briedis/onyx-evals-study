      If the operator charges for services, they must give the resident a separate schedule of the charges
      before the resident moves in, and an itemised account of the resident's use. A cap limiting laundry
      charges to cost applies only to Homes Victoria and registered housing agencies in certain declared
      rooming houses, not to every rooming house. The resident should check whether they were given a
      schedule of service charges before moving in, and ask the operator for it. If the machines don't
      work, they can ask for repairs, and they can get advice from Consumer Affairs Victoria or Tenants
      Victoria if the charges weren't disclosed.
