    role: needs more facts
    gold_answer: 'It depends on the arrangement, and the law doesn''t give one answer without more facts.
      A rental agreement can be written or unwritten. If the renter let part of the home to the friend
      (for example, a room that is only theirs, in exchange for rent), that can be a sub-letting: the
      renter then counts as the friend''s landlord under the Act and can only end it through the Act''s
      notice process, and forcing a renter out other than under the Act is an offence. Sub-letting without
      the landlord''s written consent is invalid unless VCAT decides consent wasn''t needed, and it may
      put the renter in breach of their own lease; these documents don''t say what an invalid sub-letting
      means for the friend''s position, which is another reason the answer isn''t settled. If the friend
      only shares the home without their own space, the Act may not apply and ordinary agreement rules
      decide it, which aren''t in these documents. What decides it: whether the friend has a space that''s
      only theirs, what was agreed, and what they pay. The renter shouldn''t lock the friend out or remove
      their belongings. They should work out what was agreed and paid, and can get advice (for example,
      from Tenants Victoria or Consumer Affairs Victoria) before giving any notice.'
