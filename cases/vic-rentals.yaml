- id: vr-newsq-008-2025-10-01
  category: story
  question: It is 1 October 2025. I applied for a rental at the advertised price, then got an email saying
    I had withdrawn even though I had not. The property is now listed at a higher rent, and I heard someone
    else offered more than the advertised price. Can I challenge what happened, and what should I save
    as evidence?
  document_set: vic-rentals-baseline
  expected_documents:
  - rta-1997-v110-2025-08-06.pdf
  expected_not_cited:
  - rta-1997-v088-2019-07-02.pdf
  - rta-1997-v089-2019-12-04.pdf
