    role: needs more facts
    gold_answer: 'A renter asks to keep a pet using the official request form, and the landlord must not
      unreasonably refuse. The agent saying no is not enough to refuse: the landlord is taken to have
      consented unless they apply to VCAT within 14 days after getting the request. Only VCAT can decide
      that a refusal is reasonable, looking at things like the type of pet and the property; the owner''s
      allergy doesn''t decide it automatically. Three weeks have passed, so unless the landlord applied
      to VCAT within the first 14 days, consent is taken as given. VCAT also considers whether refusing
      is allowed under any other law, and because it''s an apartment, the owners corporation rules may
      also cover pets; they are separate from the rental law. The renter can ask the agent in writing
      whether the landlord applied to VCAT within 14 days, and if not, say that consent is taken as given,
      and check the owners corporation rules before bringing the dog.'
