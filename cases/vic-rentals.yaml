  - rta-1997-v101-2022-09-07.pdf
  - rta-1997-v111-2025-11-25.pdf
  - rta-1997-v115-2026-10-13.pdf
  expects_citations: true
  must_contain:
  - - '110'
    - version 110
    - version no. 110
    - v110
  must_not_contain: []
  judge_questions:
  - must-mention
  - must-not-say
  - version-cited
  ground_truth_ref:
  - doc: rta-1997-v110-2025-08-06.pdf
    location: 'Version 110: ss 30F–30G, fixed-amount rent offers (no s 30F(4)); false or misleading rent
      advertising'
    quote: 30F Rented premises must be offered for rent at a fixed
  correct_answer_summary: '- Relisting at a higher fixed rent isn''t illegal by itself.

    - Asking for or inviting offers above the advertised rent is banned.

    - If the higher offer was unsolicited, the rental Act did not ban accepting it on this date (only
    inviting it was banned).

    - The false "withdrawn" email isn''t covered by a specific rental-law rule.'
  wrong_answer_looks_like: '- That relisting at a higher rent is illegal by itself.

    - That accepting a higher unsolicited offer is illegal on this date.

    - That the applicant can force the agent to rent the property to them.'
  must_cite:
  - Residential Tenancies Act 1997, Authorised Version No. 110 (ss 30F, 30G)
  in_force:
  - Residential Tenancies Act 1997, Authorised Version No. 110, dated 6 August 2025
  - Residential Tenancies Regulations 2021, Authorised Version No. 004, dated 1 July 2025
  - Residential Tenancies (Rooming House Standards) Regulations 2023, Authorised Version No. 002, dated
    1 December 2024
  extra:
    question_id: NEWSQ-008
    scenario_date: '2025-10-01'
    role: story
    gold_answer: 'Rent must be advertised as a fixed amount, but relisting at a new, higher fixed amount
      isn''t illegal by itself. The landlord or agent must not ask for or invite offers above the advertised
      rent. If someone else offered more without being asked, the rental Act did not ban the agent from
      accepting it on this date; it would only be banned if the agent had invited it. The rental Act has
      no specific rule about falsely marking an application as withdrawn. Its ban on misleading claims
      about rent covers only landlords and agents not acting in trade or commerce; a professional agent
      is covered instead by the Australian Consumer Law ban on misleading conduct, which isn''t in these
      documents. There''s no right to be given the property: challenging means complaining, not forcing
      the agent to rent it to them. The applicant can save the original ad (price and date), the application
      confirmation, the "withdrawn" email and the new listing, ask the agent in writing to explain, and
      complain to Consumer Affairs Victoria.'
    optional_credit:
    - The false "withdrawn" email may be misleading conduct (Australian Consumer Law for a professional
      agent).
    - 'Saving the evidence: the original ad, the application confirmation, the "withdrawn" email and the
      new listing.'
    - Complaining to Consumer Affairs Victoria.
    quick: true
