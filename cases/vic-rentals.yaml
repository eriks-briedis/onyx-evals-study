  correct_answer_summary: '- The standard requires working washing machines (one per 12 residents).

    - The law doesn''t say the machines must be free.

    - Charges for services must be set out in a schedule given before moving in.

    - Next step: check whether a schedule of charges was given before moving in, or ask the operator for
